spring.application.name=transactions-api

# Reject values with the wrong JSON type (e.g. "amount": "2") instead of converting them silently
spring.jackson.mapper.allow-coercion-of-scalars=false

# Reject decimals in integer fields (e.g. "parent_id": 10.7) instead of truncating them silently
spring.jackson.deserialization.accept-float-as-int=false

# Reject unknown fields (e.g. "parentId" instead of "parent_id") instead of ignoring them silently
spring.jackson.deserialization.fail-on-unknown-properties=true
